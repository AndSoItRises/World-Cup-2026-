name: WC2026 Daily Pipeline

on:
  # DECISION (DL-17): scores stay on the local ESPN loop (refresh_all.ps1) as PRIMARY.
  # This cloud/football-data path is kept MANUAL-ONLY until the API is verified
  # (competition code WC2026 vs WC, free-tier coverage) and you choose to cut over —
  # so two pushers don't fight over wc2026_live_results.csv and a misconfigured API
  # can't silently blackout. To activate twice-daily auto-fetch after verifying,
  # uncomment the schedule block below.
  # schedule:
  #   - cron: '0 4 * * *'   # 04:00 UTC (midnight ET) — after most matchdays settle
  #   - cron: '0 10 * * *'  # 10:00 UTC — second run catches late finishers
  workflow_dispatch:       # manual trigger (Actions tab → Run workflow)

permissions:
  contents: write          # allow the bot to push the auto-commit

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: requirements.txt pins numpy 2.4 / pandas 3.0, which need Python >= 3.11.
      # 3.13 matches the local dev environment; do not drop to 3.10 (pip install fails).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 1 of the pipeline: pull FINISHED matches from football-data.org and
      # merge them into data/raw/wc2026_live_results.csv.
      - name: Ingest results
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m src.models.ingest_results

      # Refresh the live forecast off the updated results file.
      # As later phases land, live_update will orchestrate the full sequence
      # (settle → ELO → form → picks → sim → ...) and these two steps collapse
      # into a single `python -m src.models.live_update` entrypoint.
      - name: Run live update
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m src.models.live_update

      # Single settler (DL-17): settle_bets owns status/pnl.
      - name: Settle bets
        run: python -m src.models.settle_bets

      # Monitor (DL-17): a non-zero exit FAILS this workflow, and GitHub emails the
      # repo owner — the "flag me if anything is broken" signal. Runs before the
      # commit so a broken state is surfaced, not silently pushed.
      - name: Health check
        run: python -m src.models.health_check

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto(results+picks): refresh $(date -u '+%Y-%m-%d %H:%M')"
          git push
